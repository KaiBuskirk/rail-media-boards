<!doctype html><meta charset="utf-8"><title>Rail-Works PWA stub</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0b0e14;
 color:#e8eaf0;font:600 42px/1.3 -apple-system,Helvetica,Arial,sans-serif;text-align:center}
 small{display:block;font:400 20px/1.6 ui-monospace,Menlo,monospace;color:#8b97b0;margin-top:18px}</style>
<div>PWA STUB — installable, offline-capable
  <small id="s">registering service worker…</small></div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(() => document.getElementById('s').textContent =
      'service worker ACTIVE — this page now survives a network outage')
    .catch(e => document.getElementById('s').textContent = 'SW failed: ' + e.message);
} else { document.getElementById('s').textContent = 'no service worker support in this browser'; }
</script>
